<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars App</title>
    <!-- 1. Подключаем SDK Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        /* Автоматически подстраиваем цвета под тему Telegram (темная/светлая) */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .user-info { margin-bottom: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="user-info" id="user-info">Загрузка данных...</div>
    <button id="buy-stars-btn">Потратить 5 Звёзд</button>

    <script>
        // 2. Инициализируем WebApp
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что приложение готово к показу
        tg.expand(); // Разворачиваем окно на максимум

        // Выводим имя пользователя из Telegram
        const userInfo = document.getElementById('user-info');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userInfo.innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        } else {
            userInfo.innerText = `Привет, Аноним!`;
        }

        // 3. Обработка клика по кнопке
        document.getElementById('buy-stars-btn').addEventListener('click', async () => {
            // Запрашиваем у нашего бэкенда платежную ссылку (invoice link)
            try {
                const response = await fetch('https://your-backend-api.com', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: tg.initDataUnsafe?.user?.id || 0,
                        stars_count: 5 
                    })
                });
                
                const data = await response.json();
                
                if (data.invoice_link) {
                    // 4. Открываем нативное окно оплаты Telegram Stars
                    tg.openInvoice(data.invoice_link, function(status) {
                        if (status === 'paid') {
                            tg.showAlert('Оплата успешно завершена! Звёзды зачислены.');
                        } else if (status === 'cancelled') {
                            tg.showAlert('Вы отменили оплату.');
                        } else {
                            tg.showAlert('Произошла ошибка при оплате.');
                        }
                    });
                } else {
                    alert('Не удалось получить ссылку на оплату');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка связи с бэкендом');
            }
        });
    </script>
</body>
</html>
