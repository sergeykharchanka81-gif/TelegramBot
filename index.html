<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Игра</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: var(--tg-theme-bg-color, #17212b);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    user-select: none;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    gap: 16px;
  }

  /* ===== Верхняя панель ===== */
  .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .wallet {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 10px 8px 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }

  .coin-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  .balance {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .3px;
    min-width: 26px;
    text-align: right;
  }

  .currency {
    font-size: 13px;
    color: var(--hint);
    font-weight: 500;
    margin-right: 2px;
  }

  .topup-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(135deg, #ffb547, #ff8a00);
    color: #1a1a1a;
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }

  .topup-btn:active {
    transform: scale(.94);
    filter: brightness(.9);
  }

  .star {
    font-size: 14px;
    line-height: 1;
  }

  /* ===== Основная область ===== */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
  }

  .play-btn {
    width: 100%;
    max-width: 340px;
    padding: 20px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .5px;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(46, 166, 255, .35);
    transition: transform .12s ease, filter .12s ease, box-shadow .2s ease;
  }

  .play-btn:active {
    transform: scale(.97);
    filter: brightness(.9);
    box-shadow: 0 4px 12px rgba(46, 166, 255, .3);
  }

  /* ===== Тост ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(32px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: var(--card);
    color: var(--text);
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
    z-index: 10;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>

  <!-- Верхняя панель: валюта -->
  <div class="topbar">
    <div class="wallet">
      <svg class="coin-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" fill="#FFB547"/>
        <circle cx="12" cy="12" r="8.5" fill="#FFD280"/>
        <text x="12" y="16.5" font-size="11" font-weight="700"
              text-anchor="middle" fill="#8A5A00" font-family="Arial, sans-serif">₵</text>
      </svg>
      <span class="currency">coins</span>
      <span class="balance" id="balance">0</span>
      <button class="topup-btn" id="topupBtn">
        <span class="star">⭐</span>
        <span>5</span>
      </button>
    </div>
  </div>

  <!-- Кнопка Играть -->
  <div class="content">
    <button class="play-btn" id="playBtn">Играть</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor?.('secondary_bg_color');
    tg.setBackgroundColor?.('#17212b');
    tg.disableVerticalSwipes?.();
  }

  const balanceEl = document.getElementById('balance');
  const toastEl   = document.getElementById('toast');

  // ---- Баланс (пока локально, позже заменить на данные из бэкенда) ----
  let balance = Number(localStorage.getItem('coins_balance') || 0);

  function renderBalance() {
    balanceEl.textContent = balance.toLocaleString('ru-RU');
  }

  function setBalance(value) {
    balance = Math.max(0, Math.round(value));
    localStorage.setItem('coins_balance', balance);
    renderBalance();
  }

  let toastTimer;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ---- Пополнение за 5 звёзд ----
  const TOPUP_AMOUNT = 100;   // сколько coins начислить за 5 звёзд
  const TOPUP_PRICE  = 5;     // цена в Telegram Stars

  document.getElementById('topupBtn').addEventListener('click', () => {
    if (tg?.showConfirm) {
      tg.showConfirm(`Пополнить на ${TOPUP_AMOUNT} coins за ${TOPUP_PRICE} ⭐?`, (ok) => {
        if (ok) processTopup();
      });
    } else {
      processTopup();
    }
  });

  function processTopup() {
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    // ⚠️ Здесь нужно вызвать ваш бэкенд, который создаст счёт
    // на оплату через Telegram Stars (sendInvoice / createInvoiceLink).
    // После успешной оплаты бот пришлёт вебхук → начислите coins.

    setBalance(balance + TOPUP_AMOUNT);
    toast(`+${TOPUP_AMOUNT} coins ⭐`);
  }

  // ---- Играть ----
  document.getElementById('playBtn').addEventListener('click', () => {
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

    // ⚠️ Здесь логика запуска игры
    toast('Игра запускается…');
  });

  renderBalance();
</script>
</body>
</html>
